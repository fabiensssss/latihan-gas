<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3322">
  <meta name="robots" content="noindex, nofollow">
  <title>Laporan Harian Produksi BGA</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section id="login" class="login hidden">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-top">
        <img src="img/logo.png" alt="Logo Bumitama Gunajaya Agro">
        <h1>Laporan Harian Produksi</h1>
        <p>PT Bumitama Gunajaya Agro</p>
      </div>
      <div class="login-body">
        <label for="pin">PIN</label>
        <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••••" required>
        <button class="btn block" id="loginBtn" type="submit">Masuk</button>
        <div class="err" id="loginErr" role="alert"></div>
      </div>
    </form>
  </section>

  <!-- ============ APLIKASI ============ -->
  <section id="app" class="hidden">
    <header class="hero">
      <div class="hero-in">
        <div class="brand">
          <img src="img/logo.png" alt="Logo Bumitama Gunajaya Agro">
          <div>
            <h1>Laporan Harian Produksi BGA</h1>
            <p>PT Bumitama Gunajaya Agro · Bedah gap per region &amp; estate</p>
          </div>
        </div>
        <div class="datenav">
          <button class="arrow" id="prevDate" type="button" aria-label="Tanggal sebelumnya">‹</button>
          <div class="mid">
            <small>Tanggal laporan</small>
            <b id="dateLabel">–</b>
            <select id="datePick" class="date-pill" aria-label="Pilih tanggal laporan"></select>
          </div>
          <button class="arrow" id="nextDate" type="button" aria-label="Tanggal berikutnya">›</button>
        </div>
        <div class="user-box"><span id="userName"></span><button id="logoutBtn" type="button">Keluar</button></div>
      </div>
      <div class="kpi-strip" id="kpiStrip"></div>
    </header>

    <div class="layout">
      <aside class="side">
        <h4>Laporan</h4>
        <nav class="tabs" id="tabs">
          <button data-view="ringkasan" class="active" type="button"><i>1</i>Ringkasan</button>
          <button data-view="bedah" type="button"><i>2</i>Bedah Gap</button>
          <button data-view="drill" type="button"><i>3</i>Drill-down</button>
          <button data-view="admin" type="button" class="hidden" id="tabAdmin"><i>⚙</i>Admin</button>
        </nav>
      </aside>
      <main id="view"></main>
    </div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/parser.js?v=6"></script>
  <script src="js/analisa.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
